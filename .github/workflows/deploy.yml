name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Custom domain: the site is served from the root of thealchemyofsovereignty.com
      - run: npm run build
        env:
          BASE_PATH: /
      # Give every route its own file so Pages answers with 200 (not 404) for /about, /booking, etc.
      - run: |
          for r in about services offerings faq booking; do
            mkdir -p dist/$r
            cp dist/index.html dist/$r/index.html
          done
      # Fallback for unknown URLs (shows the in-app 404 page)
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
